name: CD — Deploy Gate & Production

on:
  workflow_run:
    workflows: ["CI — Checks & Build"]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════
  # STAGE 4 — DEPLOY GATE
  # ═══════════════════════════════════════════

  deploy-gate:
    name: 🚦 Deploy Gate
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ✅ Verify CI passed
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🚦 DEPLOY GATE CHECK"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Branch   : ${{ github.ref_name }}"
          echo "  Commit   : ${{ github.sha }}"
          echo "  Actor    : ${{ github.actor }}"
          echo "  Trigger  : ${{ github.event_name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CI_RESULT="${{ github.event.workflow_run.conclusion }}"
            echo "  CI Result: $CI_RESULT"
            if [ "$CI_RESULT" != "success" ]; then
              echo "❌ Deploy gate BLOCKED — CI checks did not pass!"
              exit 1
            fi
          fi
          echo "  ✅ All gates passed — proceeding to production"

      - name: 🔍 Verify required secrets are set
        run: |
          MISSING=()
          [ -z "${{ secrets.RENDER_API_KEY }}" ]     && MISSING+=("RENDER_API_KEY")
          [ -z "${{ secrets.RENDER_SERVICE_ID }}" ]  && MISSING+=("RENDER_SERVICE_ID")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing required secrets: ${MISSING[*]}"
            echo "   → Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ All required secrets are configured"

      - name: 📋 Pre-deployment checklist
        run: |
          echo "Running pre-deployment checklist..."
          CHECKS_PASSED=0
          TOTAL_CHECKS=4

          # Check 1: Branch is main
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "  ✅ [1/$TOTAL_CHECKS] Deploying from main branch"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ⚠️  [1/$TOTAL_CHECKS] Not on main branch: ${{ github.ref_name }}"
          fi

          # Check 2: Required files exist
          for f in app.py models.py requirements.txt Procfile; do
            if [ ! -f "$f" ]; then
              echo "  ❌ Missing required file: $f"
              exit 1
            fi
          done
          echo "  ✅ [2/$TOTAL_CHECKS] Required files present"
          CHECKS_PASSED=$((CHECKS_PASSED + 1))

          # Check 3: requirements.txt has content
          if [ -s requirements.txt ]; then
            echo "  ✅ [3/$TOTAL_CHECKS] requirements.txt is valid"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ❌ [3/$TOTAL_CHECKS] requirements.txt is empty"
            exit 1
          fi

          # Check 4: render.yaml exists
          if [ -f "render.yaml" ]; then
            echo "  ✅ [4/$TOTAL_CHECKS] render.yaml config found"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ⚠️  [4/$TOTAL_CHECKS] render.yaml not found (manual deploy needed)"
          fi

          echo ""
          echo "  🚦 Gate result: $CHECKS_PASSED/$TOTAL_CHECKS checks passed"

          if [ $CHECKS_PASSED -lt 3 ]; then
            echo "  ❌ Insufficient checks passed — blocking deployment"
            exit 1
          fi
          echo "  ✅ Deploy gate APPROVED — deploying to production"

  # ═══════════════════════════════════════════
  # STAGE 5 — PRODUCTION
  # ═══════════════════════════════════════════

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-gate
    environment:
      name: production
      url: https://umukozi.onrender.com

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Trigger Render deployment
        id: trigger
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🚀 DEPLOYING TO PRODUCTION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Commit : ${{ github.sha }}"
          echo "  Time   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          HTTP_STATUS=$(curl -s -o /tmp/render_resp.json -w "%{http_code}" \
            --request POST \
            --url "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}')

          echo "Render API response (HTTP $HTTP_STATUS):"
          cat /tmp/render_resp.json

          if [ "$HTTP_STATUS" -eq 201 ]; then
            DEPLOY_ID=$(python3 -c "import sys,json; d=json.load(open('/tmp/render_resp.json')); print(d.get('deploy',{}).get('id',''))" 2>/dev/null || echo "")
            echo "✅ Deployment triggered! Deploy ID: $DEPLOY_ID"
            echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to trigger deployment (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: ⏳ Wait for deployment to go live
        run: |
          DEPLOY_ID="${{ steps.trigger.outputs.deploy_id }}"
          echo "Waiting for deploy $DEPLOY_ID to go live..."

          MAX_ATTEMPTS=30      # 30 × 20s = 10 minutes
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            sleep 20

            RESP=$(curl -s \
              --request GET \
              --url "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")

            STATUS=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('deploy',{}).get('status','unknown'))" 2>/dev/null || echo "unknown")
            echo "  [$ATTEMPT/$MAX_ATTEMPTS] Status: $STATUS"

            case "$STATUS" in
              live)
                echo "✅ Deployment is LIVE!"
                break
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "❌ Deployment failed with status: $STATUS"
                exit 1
                ;;
            esac
          done

          if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
            echo "⚠️ Timeout — check Render dashboard manually"
          fi

      - name: 🌐 Production health check
        run: |
          APP_URL="https://umukozi.onrender.com"
          echo "Running health check on $APP_URL ..."
          sleep 15

          for i in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL" || echo "000")
            echo "  Health check $i/3: HTTP $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
              echo "✅ Production is healthy and responding!"
              exit 0
            fi
            sleep 10
          done
          echo "⚠️ App may still be starting — check $APP_URL manually"

      - name: 🎉 Deployment summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🎉 PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🌐 URL     : https://umukozi.onrender.com"
          echo "  📝 Commit  : ${{ github.sha }}"
          echo "  👤 Actor   : ${{ github.actor }}"
          echo "  📅 Time    : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: ❌ Deployment failure summary
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ❌ PRODUCTION DEPLOYMENT FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📝 Commit  : ${{ github.sha }}"
          echo "  👤 Actor   : ${{ github.actor }}"
          echo "  📅 Time    : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  🔍 Logs    : https://dashboard.render.com"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
