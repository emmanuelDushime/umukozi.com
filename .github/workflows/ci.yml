name: CI — Test & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint & Code Quality
  # ─────────────────────────────────────────
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-bugbear

      - name: 🔎 Run Flake8 linter
        run: |
          # Stop build on critical errors (E9xx = syntax/runtime, F8xx = undefined names)
          flake8 app.py models.py translations.py \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
          # Warn on style issues but don't fail the build
          flake8 app.py models.py translations.py \
            --count \
            --exit-zero \
            --max-line-length=120 \
            --statistics

  # ─────────────────────────────────────────
  # JOB 2: Build & Test
  # ─────────────────────────────────────────
  test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    needs: lint

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret-key-do-not-use-in-prod
      DATABASE_URL: sqlite:///test_umukozi.db
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🗄️ Initialize test database
        run: |
          python -c "
          import os
          os.environ['DATABASE_URL'] = 'sqlite:///test_umukozi.db'
          os.environ['SECRET_KEY'] = 'ci-test-secret'
          from app import app, db
          with app.app_context():
              db.create_all()
              print('✅ Test database created successfully')
          "

      - name: 🧪 Run tests
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
          else
            echo "ℹ️ No tests found — running app import smoke test"
            python -c "
          import os
          os.environ['DATABASE_URL'] = 'sqlite:///test_umukozi.db'
          os.environ['SECRET_KEY'] = 'ci-test-secret'
          from app import app
          with app.test_client() as client:
              r = client.get('/')
              assert r.status_code in [200, 302], f'Unexpected status: {r.status_code}'
              print(f'✅ Smoke test passed — GET / returned {r.status_code}')
          "
          fi

      - name: 📊 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: 🧹 Cleanup test database
        if: always()
        run: rm -f test_umukozi.db

  # ─────────────────────────────────────────
  # JOB 3: Security Scan
  # ─────────────────────────────────────────
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install security tools
        run: |
          pip install pip-audit safety

      - name: 🔒 Audit dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt
          pip-audit --requirement requirements.txt --ignore-vuln PYSEC-2024-47 || true

      - name: 🛡️ Run Safety check
        run: |
          safety check -r requirements.txt --continue-on-error || true
