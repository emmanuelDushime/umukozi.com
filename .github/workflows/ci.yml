name: CI — Checks & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ═══════════════════════════════════════════
  # STAGE 2 — CI CHECKS
  # ═══════════════════════════════════════════

  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-bugbear

      - name: 🔎 Flake8 — Critical errors (fails build)
        run: |
          flake8 app.py models.py translations.py \
            --count --select=E9,F63,F7,F82 \
            --show-source --statistics

      - name: 🔎 Flake8 — Style warnings (does not fail build)
        run: |
          flake8 app.py models.py translations.py \
            --count --exit-zero \
            --max-line-length=120 --statistics

  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies + audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit safety

      - name: 🔒 pip-audit — Dependency vulnerabilities
        run: pip-audit --requirement requirements.txt || true

      - name: 🛡️ Safety — Known CVE check
        run: safety check -r requirements.txt --continue-on-error || true

  test:
    name: 🧪 Tests & Smoke Test
    runs-on: ubuntu-latest
    needs: lint

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: sqlite:///test_umukozi.db
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🗄️ Initialize test database
        run: |
          python -c "
          import os
          os.environ['DATABASE_URL'] = 'sqlite:///test_umukozi.db'
          os.environ['SECRET_KEY'] = 'ci-test-secret'
          from app import app, db
          with app.app_context():
              db.create_all()
              print('✅ Test database initialized')
          "

      - name: 🧪 Run tests / smoke test
        run: |
          if compgen -G "tests/*.py" > /dev/null 2>&1; then
            pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
          else
            echo "ℹ️ No test files found — running smoke test"
            python -c "
          import os
          os.environ['DATABASE_URL'] = 'sqlite:///test_umukozi.db'
          os.environ['SECRET_KEY'] = 'ci-test-secret'
          from app import app
          with app.test_client() as c:
              r = c.get('/')
              assert r.status_code in [200, 302], f'Smoke test failed: {r.status_code}'
              print(f'✅ Smoke test passed — GET / returned {r.status_code}')
          "
          fi

      - name: 📊 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: 🧹 Cleanup
        if: always()
        run: rm -f test_umukozi.db

  # ═══════════════════════════════════════════
  # STAGE 3 — BUILD
  # ═══════════════════════════════════════════

  build:
    name: 🏗️ Build & Validate
    runs-on: ubuntu-latest
    needs: [ lint, test, security ]

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-build-secret-key
      DATABASE_URL: sqlite:///build_umukozi.db

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Validate database schema
        run: |
          python -c "
          import os
          os.environ['DATABASE_URL'] = 'sqlite:///build_umukozi.db'
          os.environ['SECRET_KEY'] = 'build-secret'
          from app import app, db
          with app.app_context():
              db.create_all()
              from models import User, Worker, Employer, Job, Application, Review
              print('✅ All models validated successfully')
          "

      - name: 📁 Verify required files exist
        run: |
          echo "Checking required project files..."
          for f in app.py models.py requirements.txt translations.py Procfile render.yaml; do
            if [ -f "$f" ]; then
              echo "  ✅ $f"
            else
              echo "  ❌ MISSING: $f"
              exit 1
            fi
          done

      - name: 🌐 Validate templates exist
        run: |
          python -c "
          import os
          required = ['index.html', 'login.html', 'register.html', '404.html', '500.html']
          missing = [t for t in required if not os.path.exists(f'templates/{t}')]
          if missing:
              print(f'❌ Missing templates: {missing}')
              exit(1)
          print(f'✅ All {len(required)} required templates found')
          "

      - name: 📦 Create build artifact
        run: |
          mkdir -p build
          echo "BUILD_SHA=${{ github.sha }}" > build/build-info.txt
          echo "BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> build/build-info.txt
          echo "BRANCH=${{ github.ref_name }}" >> build/build-info.txt
          cat build/build-info.txt

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ github.sha }}
          path: build/
          retention-days: 7

      - name: 🧹 Cleanup
        if: always()
        run: rm -f build_umukozi.db
